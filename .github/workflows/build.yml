name: Build DLL

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test

      - name: Build
        run: dotnet build TecWrapperAPI/TecWrapperAPI.csproj -c Release

      - name: Upload dll as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TecWrapperAPI
          path: TecWrapperAPI/bin/Release/net9.0/TecWrapperAPI.dll

      - name: Create draft release with the dll
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: TecWrapperAPI/bin/Release/net9.0/TecWrapperAPI.dll
